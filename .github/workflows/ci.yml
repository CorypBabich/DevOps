name: Dice_Roller

run-name: ${{ github.actor }} is testing out GitHub Actions 🚀

on:
  push:
    branches:
      - main
jobs:
  Explore-GitHub-Actions:
    runs-on: ubuntu-latest
    steps:
    # - uses: actions/checkout@v4
    # - name: Show repository contents
    #   run: |
    #     pwd
    #     ls
    - uses: actions/checkout@v4
    - name: Build and Test
      working-directory: devops_frontend
      run: docker build . | dotnet test --no-build
    
    # compose-smoke:
    # name: Compose build and smoke
    # runs-on: ubuntu-latest
    # needs: [unit-tests, container-tests]
    # if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # steps:
    - uses: actions/checkout@v4
    - name: Build and start stack
      run: docker compose up --build -d --wait
    - name: Check backend
      run: curl --fail --retry 10 --retry-delay 3 http://localhost:5080/health || curl --fail --retry 10 --retry-delay 3 http://localhost:5080/
    - name: Check frontend
      run: curl --fail --retry 10 --retry-delay 3 http://localhost:5081/
    - name: Compose logs on failure
      if: failure()
      run: docker compose logs
    - name: Tear down
      if: always()
      run: docker compose down -v


 